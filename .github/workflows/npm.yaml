name: Npm

on:
  release:
    types: [published, edited]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # tag=v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Publish packages
        run: |
          npm ci
          npx lerna run prepack
          npx lerna publish from-package -y

      - name: Upload logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        if: failure()
        with:
          name: lerna-debug-log
          path: lerna-debug.log
